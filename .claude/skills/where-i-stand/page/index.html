<style>

@media (prefers-color-scheme: dark) { :root { --page: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #9198a1; --line: #3d444d; --link: #4493f8; --code: #262c36; --needs-you-card: #2a2206; --needs-you-line: #d29922; --problem: #ff7b72; } }

pre { background: var(--code); border-radius: 6px; padding: 12px; white-space: pre-wrap; } pre code { background: none; padding: 0; }

details > div > p:first-child { margin: 16px 0 0; font-size: 14px; color: var(--muted); } details > div > p:first-child + h3 { margin-top: 0; } #work h3 { font: 600 15px/1.4 system-ui, sans-serif; } #work .problem { color: var(--problem); font-weight: 600; }
#work table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 15px; } #work th, #work td { text-align: left; vertical-align: top; padding: 8px 8px 8px 0; border-top: 1px solid var(--line); }

#work h3 + table { table-layout: auto; overflow-wrap: break-word; } #work h3 + table th:first-child { width: auto; } #work td:is([data-label="Age"], [data-label="CI"]) { white-space: nowrap; }

  #work thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

</style>
<header>
<h1>Where I stand</h1>
<p id="file-time">Fetching the file.</p>
<p id="fetch-problem" role="status"></p><p id="save-announcement" class="visually-hidden" role="status"></p>
</header>
<main>
<section id="work">
<h2>Your work</h2>
<p id="records-time">Fetching the pull request records.</p>
<div id="work-details"></div>
</section>

<script>window.location.pathname.endsWith('/') || window.location.pathname.endsWith('.html') || window.location.replace(`${window.location.pathname}/${window.location.search}${window.location.hash}`);</script><script src="edit-entries.js"></script><script>
const markdownFileName = 'where-i-stand.md';
const recordsFileName = 'where-i-stand-prs.json';
const pageFileExtension = '.html';
const refreshIntervalMilliseconds = 60000;
const needsYouHeading = 'Needs you';
const webProtocols = ['http:', 'https:'];
const workColumns = ['Links', 'What sort of work', 'Where it stands'];
const noWorkWords = 'No pull requests or agent entries to show.';
const missingLinkWords = { forgejo: 'no Forgejo copy', github: 'not on GitHub yet', ticket: 'no ticket' };
const noPullRequestWords = 'no pull request';
const kindNotStatedWords = 'kind not stated';
const linkSeparator = ' · ';
const kindTitleSeparator = ' — ';
const throneAndDotfilesRepositoryNames = ['throne', 'dotfiles'];
const throneAndDotfilesWords = 'Throne and dotfiles';
const otherPullRequestTables = [
  { heading: 'Waiting for your review', recordsKey: 'waiting_for_review', columns: ['Pull request', 'Title', 'Author', 'Waiting on', 'CI', 'Age'], emptyWords: 'No pull requests are waiting for your review.' },
  { heading: "Your teammates' pull requests", recordsKey: 'teammates', columns: ['Author', 'Pull request', 'Title', 'State', 'CI', 'Last updated'], emptyWords: 'No open pull requests from your teammates.' },
];

const fencePattern = /^\s{0,3}(```+|~~~+)/;
const headingPattern = /^\s{0,3}(#{1,6})\s+(.*)$/;
const rulePattern = /^\s{0,3}([-*_])(\s*\1){2,}\s*$/;
const quotePattern = /^\s{0,3}>\s?(.*)$/;
const listItemPattern = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const inlinePattern = /(`+)(.+?)\1|\[([^\]]+)\]\(([^)\s]+)\)|\*\*(?!\s)(.+?)\*\*|\*(?!\s)(.+?)\*|<(https?:\/\/[^\s>]+)>|(https?:\/\/[^\s<>]*[^\s<>.,;:!?)'"])|\\([!-\/:-@[-`{-~])/;

const entryLinePattern = /^\s*[-*+]\s+(Links|Kind|Where it stands):\s*(.*)$/;
const linkPartPattern = /^(Forgejo|GitHub|Ticket)\s+(.*)$/;
const supersededLinePattern = /^\s*(?:- )?Superseded by `### /;

const pageContent = document.getElementById('page-content');
const fileTime = document.getElementById('file-time');
const fetchProblem = document.getElementById('fetch-problem');
const recordsTime = document.getElementById('records-time');
const workDetails = document.getElementById('work-details');
let shownMarkdown = null;
let shownRecordsText = null;
let shownRecords = null;
let refreshesStarted = 0;
const shownSpoilers = {};

function element(tagName, children = [], className = '') {
  const created = document.createElement(tagName);
  created.append(...children);
  if (className) created.classList.add(className);
  return created;
}

function renderLink(children, target, markdownSource) {
  if (webAddress(target, document.baseURI) === null) return markdownSource;
  const link = element('a', children);
  link.setAttribute('href', target);
  link.setAttribute('rel', 'noreferrer');
  return link;
}

function renderInlineMatch(match) {
  const [markdownSource, , code, linkText, linkTarget, strong, emphasis, bracketedAddress, bareAddress, escapedCharacter] = match;
  if (code !== undefined) return element('code', [code.trim()]);
  if (linkText !== undefined) return renderLink(renderInline(linkText), linkTarget, markdownSource);
  if (strong !== undefined) return element('strong', renderInline(strong));
  if (emphasis !== undefined) return element('em', renderInline(emphasis));
  if (bracketedAddress !== undefined) return renderLink([bracketedAddress], bracketedAddress, markdownSource);
  if (bareAddress !== undefined) return renderLink([bareAddress], bareAddress, markdownSource);
  return escapedCharacter;
}

function renderInline(text) {
  const nodes = [];
  let remaining = text;
  while (remaining !== '') {
    const match = inlinePattern.exec(remaining);
    if (match === null) {
      nodes.push(remaining);
      break;
    }
    if (match.index > 0) nodes.push(remaining.slice(0, match.index));
    nodes.push(renderInlineMatch(match));
    remaining = remaining.slice(match.index + match[0].length);
  }
  return nodes;
}

function indentWidth(line) {
  return line.length - line.trimStart().length;
}

function readFencedCode(lines, start) {
  const fence = fencePattern.exec(lines[start])[1];
  let end = start + 1;
  while (end < lines.length && !lines[end].trim().startsWith(fence)) end += 1;
  const code = lines.slice(start + 1, end).join('\n');
  return { block: element('pre', [element('code', [code])]), next: end + 1 };
}

function readHeading(lines, start) {
  const [, hashes, text] = headingPattern.exec(lines[start]);
  return { block: element(`h${hashes.length}`, renderInline(text.trim())), next: start + 1 };
}

function readQuote(lines, start) {
  const quoted = [];
  let end = start;
  while (end < lines.length && quotePattern.test(lines[end])) {
    quoted.push(quotePattern.exec(lines[end])[1]);
    end += 1;
  }
  return { block: element('blockquote', renderBlocks(quoted)), next: end };
}

function readList(lines, start) {
  const [, listIndent, firstMarker] = listItemPattern.exec(lines[start]);
  const firstNumber = Number.parseInt(firstMarker, 10);
  const list = element(Number.isNaN(firstNumber) ? 'ul' : 'ol');
  if (!Number.isNaN(firstNumber)) list.setAttribute('start', String(firstNumber));
  let position = start;
  while (position < lines.length) {
    const item = listItemPattern.exec(lines[position]);
    if (item === null || item[1].length !== listIndent.length) break;
    let end = position + 1;
    while (end < lines.length && lines[end].trim() !== '' && indentWidth(lines[end]) > listIndent.length) end += 1;
    list.append(element('li', [...renderInline(item[3]), ...renderBlocks(lines.slice(position + 1, end))]));
    position = end;
  }
  return { block: list, next: position };
}

const blockReaders = [
  { opens: fencePattern, read: readFencedCode }, { opens: headingPattern, read: readHeading },
  { opens: rulePattern, read: (lines, start) => ({ block: element('hr'), next: start + 1 }) },
  { opens: quotePattern, read: readQuote }, { opens: listItemPattern, read: readList },
];

function blockReaderFor(line) {
  return blockReaders.find(({ opens }) => opens.test(line))?.read;
}

function readParagraph(lines, start) {
  let end = start + 1;
  while (end < lines.length && lines[end].trim() !== '' && blockReaderFor(lines[end]) === undefined) end += 1;
  const children = lines.slice(start, end).flatMap((line, index) => [...(index === 0 ? [] : [element('br')]), ...renderInline(line.trim())]);
  return { block: element('p', children), next: end };
}

function renderBlocks(lines) {
  const blocks = [];
  let position = 0;
  while (position < lines.length) {
    const read = lines[position].trim() === '' ? null : blockReaderFor(lines[position]) ?? readParagraph;
    const { block, next } = read === null ? { block: null, next: position + 1 } : read(lines, position);
    if (block !== null) blocks.push(block);
    position = next;
  }
  return blocks;
}

function renderSpoiler(spoilerName, children, needsYouFlags) {
  const wasOpen = shownSpoilers[spoilerName]?.open === true;
  delete shownSpoilers[spoilerName];
  if (needsYouFlags.length === 0) return [];
  const needsYouWords = needsYouFlags.some(Boolean) ? `, ${needsYouFlags.filter(Boolean).length} needs you` : '';
  const spoiler = element('details', [element('summary', [`${throneAndDotfilesWords} (${needsYouFlags.length}${needsYouWords})`]), ...children]);
  if (wasOpen) spoiler.open = true;
  shownSpoilers[spoilerName] = spoiler;
  return [spoiler];
}

function movedEntryTarget(entries, heading, movedEntries) {
  const index = entries.findIndex((entry) => element('h3', renderInline(entry.identity)).textContent === heading.textContent);
  const entry = heading.tagName === 'H3' && index !== -1 ? entries.splice(index, 1)[0] : undefined;
  if (entry === undefined || !entryIsThroneOrDotfilesWork(entry)) return null;
  movedEntries.push({ entry, shown: element('div', [element('p', [`Section: ${entry.sectionHeading}`])]) });
  return movedEntries.at(-1).shown;
}

function groupIntoSections(blocks, entries) {
  const sections = [];
  const movedEntries = [];
  let movedEntry = null;
  for (const block of blocks) {
    const opensSection = block.tagName === 'H2';
    if (opensSection || sections.length === 0) sections.push(element('section'));
    if (opensSection && block.textContent.trim() === needsYouHeading) sections.at(-1).classList.add('needs-you');
    if (opensSection || block.tagName === 'H3') movedEntry = movedEntryTarget(entries, block, movedEntries);
    (movedEntry ?? sections.at(-1)).append(block);
  }
  const spoilers = renderSpoiler('entries', movedEntries.map(({ shown }) => shown), movedEntries.map(({ entry }) => isNeedsYouEntry(entry)));
  return [...sections, ...spoilers.map((spoiler) => element('section', [spoiler]))];
}

function webAddress(text, base) {
  try {
    const address = new URL(text.replace(/^<(.*)>$/, '$1'), base);
    return webProtocols.includes(address.protocol) ? address.href : null;
  } catch {
    return null;
  }
}

function isThroneOrDotfilesName(name) {
  const repositoryName = (name ?? '').toLowerCase().replace(/\.git$/, '');
  return throneAndDotfilesRepositoryNames.includes(repositoryName) || repositoryName.startsWith('throne-');
}

function linkNamesThroneOrDotfiles(link) {
  const firstWord = (link ?? '').trim().split(/\s+/)[0];
  const address = webAddress(firstWord);
  return isThroneOrDotfilesName(address === null ? firstWord : new URL(address).pathname.split('/')[2]);
}

function entryIsThroneOrDotfilesWork({ links, kind }) {
  return [links.forgejo, links.github, links.withoutPullRequest].some(linkNamesThroneOrDotfiles) || isThroneOrDotfilesName(kind.split(/\s+/)[0]);
}

function isNeedsYouEntry(entry) {
  return entry?.sectionHeading === needsYouHeading;
}

function readLinksLine(linksLine) {
  const parts = linksLine.split(linkSeparator).map((part) => part.trim());
  const links = { forgejo: '', github: '', ticket: '', withoutPullRequest: null };
  if (parts[0] === noPullRequestWords) links.withoutPullRequest = linkPartPattern.test(parts[1] ?? '') ? '' : parts[1] ?? '';
  for (const part of parts) {
    const linkPart = linkPartPattern.exec(part);
    if (linkPart !== null) links[linkPart[1].toLowerCase()] = linkPart[2].trim();
  }
  return links;
}

function describeEntry({ sectionHeading, identity, lines, superseded }) {
  const [kind, ...titleParts] = (lines.Kind ?? '').split(kindTitleSeparator);
  const title = titleParts.join(kindTitleSeparator).trim();
  return { sectionHeading, identity, links: readLinksLine(lines.Links ?? ''), kind: kind.trim(), title, whereItStands: lines['Where it stands'] ?? '', superseded };
}

function readEntries(markdown) {
  const entries = [];
  let sectionHeading = '';
  for (const line of markdown.split(/\r?\n/)) {
    const heading = headingPattern.exec(line);
    if (heading !== null && heading[1].length === 2) sectionHeading = heading[2].trim();
    if (heading !== null && heading[1].length === 3) entries.push({ sectionHeading, identity: heading[2].trim(), lines: {}, superseded: false });
    const entryLine = entryLinePattern.exec(line);
    const entry = entries.at(-1);
    if (entry !== undefined && supersededLinePattern.test(line)) entry.superseded = true;
    if (entryLine !== null && entry !== undefined && entry.lines[entryLine[1]] === undefined) entry.lines[entryLine[1]] = entryLine[2].trim();
  }
  return entries.map(describeEntry);
}

function pullRequestAddresses(...addresses) {
  return addresses.map((address) => webAddress(address ?? '')).filter((address) => address !== null);
}

function entryNamesRecord(entry, record) {
  const recordAddresses = pullRequestAddresses(record.forgejo?.url, record.github?.url);
  return pullRequestAddresses(entry.links.forgejo, entry.links.github).some((address) => recordAddresses.includes(address));
}

function linkItem(label, value, missingWords) {
  const address = webAddress(value ?? '');
  if (address !== null) return element('div', [renderLink([label], address, label)]);
  return element('div', [value || missingWords], !value || value === missingWords ? 'missing' : '');
}

function numberedLabel(label, number) {
  return number === undefined || number === null ? label : `${label} #${number}`;
}

function ticketItem(ticketAddress, ticketId) {
  return linkItem(ticketId ? `Ticket ${ticketId}` : 'Ticket', ticketAddress || ticketId, missingLinkWords.ticket);
}

function recordSummary(record) {
  const forgejoState = record.forgejo && `Forgejo ${record.forgejo.state ?? ''}`.trim();
  const parts = [record.group, forgejoState, record.github ? `GitHub ${record.github.state ?? ''}`.trim() : 'Forgejo only', record.head_commits];
  return [...new Set(parts.filter(Boolean))].join('; ');
}

function rowFromRecord(record, entry) {
  const ticketAddress = record.ticket_url || webAddress(entry?.links.ticket ?? '') || '';
  return {
    links: [
      linkItem(numberedLabel('Forgejo', record.forgejo?.number), record.forgejo?.url, missingLinkWords.forgejo),
      linkItem(numberedLabel('GitHub', record.github?.number), record.github?.url, missingLinkWords.github),
      ticketAddress || record.ticket ? ticketItem(ticketAddress, record.ticket) : ticketItem(entry?.links.ticket, ''),
    ],
    kind: entry?.kind || record.kind || kindNotStatedWords,
    title: record.title || entry?.title || '',
    whereItStands: [recordSummary(record), entry?.whereItStands ?? ''],
    throneOrDotfiles: isThroneOrDotfilesName(record.repository?.split('/').at(-1)) || (entry !== undefined && entryIsThroneOrDotfilesWork(entry)),
    needsYou: isNeedsYouEntry(entry),
  };
}

function rowFromEntry(entry) {
  const { links } = entry;
  const pullRequestLinks =
    links.withoutPullRequest === null
      ? [linkItem('Forgejo', links.forgejo, missingLinkWords.forgejo), linkItem('GitHub', links.github, missingLinkWords.github)]
      : [element('div', [noPullRequestWords]), element('div', renderInline(links.withoutPullRequest))];
  return {
    links: [...pullRequestLinks, ticketItem(links.ticket, '')],
    kind: entry.kind || kindNotStatedWords,
    title: entry.title || entry.identity,
    whereItStands: [entry.sectionHeading, entry.whereItStands],
    throneOrDotfiles: entryIsThroneOrDotfilesWork(entry), needsYou: isNeedsYouEntry(entry),
  };
}

function workRows(records, entries) {
  const currentEntries = entries.filter((entry) => !entry.superseded);
  const recordsWithEntries = (records?.rows ?? []).map((record) => ({ record, entry: currentEntries.find((entry) => entryNamesRecord(entry, record)) }));
  const ownEntries = currentEntries.filter((entry) => !recordsWithEntries.some((pair) => pair.entry === entry));
  return [
    ...ownEntries.filter(isNeedsYouEntry).map(rowFromEntry),
    ...recordsWithEntries.map(({ record, entry }) => rowFromRecord(record, entry)),
    ...ownEntries.filter((entry) => !isNeedsYouEntry(entry)).map(rowFromEntry),
  ];
}

function tableCell(column, children) {
  const cell = element('td', children);
  cell.setAttribute('data-label', column);
  return cell;
}

function workCells(row) {
  return [row.links, [element('div', [row.kind], 'kind'), ...(row.title ? [element('div', [row.title])] : [])], row.whereItStands.filter(Boolean).map((words) => element('div', [words]))];
}

function pullRequestCellsByColumn(pullRequest) {
  const { passing = 0, failing = 0, running = 0 } = pullRequest.checks ?? {};
  const checks = [failing && `${failing} failing`, running && `${running} running`].filter(Boolean).join(', ') || (passing ? 'green' : 'no CI');
  const state = [pullRequest.draft ? 'draft' : 'ready', (pullRequest.review ?? '').toLowerCase().replaceAll('_', ' ')].filter(Boolean).join(', ');
  const link = linkItem(numberedLabel((pullRequest.repository ?? '').split('/').at(-1), pullRequest.number), pullRequest.url, '');
  return { 'Pull request': [link], Title: [pullRequest.title], Author: [pullRequest.author], 'Waiting on': [pullRequest.waiting_on], CI: [checks],
    State: [state], Age: [describeAge(pullRequest.created_at)], 'Last updated': [describeAge(pullRequest.updated_at)] };
}

function renderTable(columns, rows, emptyWords) {
  if (rows.length === 0) return element('p', [emptyWords]);
  const head = element('thead', [element('tr', columns.map((column) => element('th', [column])))]);
  return element('table', [head, element('tbody', rows.map((cells) => element('tr', cells.map((children, index) => tableCell(columns[index], children)))))]);
}

function renderOtherPullRequestTables(records) {
  return otherPullRequestTables.flatMap(({ heading, recordsKey, columns, emptyWords }) => {
    const rows = (records?.[recordsKey] ?? []).map(pullRequestCellsByColumn).map((cells) => columns.map((column) => cells[column]));
    return [element('h3', [heading]), renderTable(columns, rows, emptyWords)];
  });
}

function renderProblems(problems) {
  if (problems.length === 0) return [];
  return [element('ul', problems.map((problem) => element('li', [`Could not read: ${problem}`])), 'problem')];
}

function renderChanges(changes) {
  if (changes.length === 0) return [];
  return [element('h3', ['Changed since the last refresh']), element('ul', changes.map((change) => element('li', renderInline(change))))];
}

function renderWork(records, markdown) {
  const rows = workRows(records, readEntries(markdown ?? ''));
  const throneAndDotfilesRows = rows.filter((row) => row.throneOrDotfiles);
  return [
    ...renderProblems(records?.problems ?? []),
    ...renderChanges(records?.changes ?? []),
    renderTable(workColumns, rows.filter((row) => !row.throneOrDotfiles).map(workCells), noWorkWords),
    ...renderSpoiler('work', [renderTable(workColumns, throneAndDotfilesRows.map(workCells), noWorkWords)], throneAndDotfilesRows.map((row) => row.needsYou)),
    ...renderOtherPullRequestTables(records),
  ];
}

function describeAge(time) {
  const minutes = Math.round((Date.now() - new Date(time).getTime()) / 60000);
  if (minutes < 1) return 'just now';
  if (minutes < 60) return `${minutes} minute${minutes === 1 ? '' : 's'} ago`;
  const hours = Math.round(minutes / 60);
  if (hours < 48) return `${hours} hour${hours === 1 ? '' : 's'} ago`;
  return `${Math.round(hours / 24)} days ago`;
}

function describeReadTime(records) {
  const readAt = new Date(records.read_at);
  if (Number.isNaN(readAt.getTime())) return 'The pull request records did not say when they were read.';
  return `Pull requests read ${describeTime(readAt)}, ${describeAge(readAt)}.`;
}

function describeRecordsTime(records, recordsFetched) {
  if (recordsFetched) return describeReadTime(records);
  const problem = `Could not fetch the pull request records at ${describeTime(new Date())}.`;
  return records === null ? problem : `${problem} Showing what was last fetched. ${describeReadTime(records)}`;
}

function folderThePageWasServedFrom() {
  const pageAddress = new URL(document.baseURI);
  const namesFolderWithoutTrailingSlash = !pageAddress.pathname.endsWith('/') && !pageAddress.pathname.endsWith(pageFileExtension);
  return new URL(namesFolderWithoutTrailingSlash ? `${pageAddress.pathname}/` : '.', pageAddress);
}

async function fetchFileBesideThePage(fileName) {
  const fileAddress = new URL(fileName, folderThePageWasServedFrom()).href;
  const response = await fetch(fileAddress, { cache: 'no-store' });
  if (!response.ok) throw new Error(`the server answered ${response.status}`);
  return { text: await response.text(), lastModified: response.headers.get('Last-Modified') };
}

function showPage(markdown, recordsText, records) {
  if (markdown === shownMarkdown && recordsText === shownRecordsText) return;
  const scrollPosition = window.scrollY;
  workDetails.replaceChildren(...renderWork(records, markdown));
  if (markdown !== shownMarkdown) showEntries(markdown ?? '');
  window.scrollTo(0, scrollPosition);
  shownMarkdown = markdown;
  shownRecordsText = recordsText;
  shownRecords = records;
}

function describeTime(time) {
  return time.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

function showFileTime(lastModified) {
  fileTime.textContent = lastModified === null ? 'The file did not say when it was last modified.' : `File last modified ${describeTime(new Date(lastModified))}`;
}

function showFetchProblem() {
  const whatIsShown = shownMarkdown === null ? 'Nothing has been fetched yet.' : 'Showing what was last fetched.';
  if (shownMarkdown === null) fileTime.textContent = '';
  fetchProblem.textContent = `Could not fetch the file at ${describeTime(new Date())}. ${whatIsShown}`;
}

async function refreshPage() {
  const refreshNumber = (refreshesStarted += 1);
  const markdownRead = fetchFileBesideThePage(markdownFileName);
  const recordsRead = fetchFileBesideThePage(recordsFileName).then(({ text }) => ({ text, records: JSON.parse(text) }));
  const [markdownFetch, recordsFetch] = await Promise.allSettled([markdownRead, recordsRead]);
  if (refreshNumber !== refreshesStarted) return;
  const recordsFetched = recordsFetch.status === 'fulfilled';
  const { text: recordsText, records } = recordsFetched ? recordsFetch.value : { text: shownRecordsText, records: shownRecords };
  const markdown = markdownFetch.value?.text ?? shownMarkdown;
  showPage(markdown, recordsText, records);
  recordsTime.textContent = describeRecordsTime(records, recordsFetched);
  if (markdownFetch.status === 'rejected') return showFetchProblem();
  fetchProblem.textContent = '';
  showFileTime(markdownFetch.value.lastModified);
}

document.addEventListener('visibilitychange', () => document.hidden || refreshPage());
setInterval(refreshPage, refreshIntervalMilliseconds);
refreshPage();
</script>
