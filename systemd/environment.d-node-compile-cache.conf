# environment.d-node-compile-cache.conf — systemd --user environment.d
# drop-in. Plain `KEY=value` lines read by the user session manager at
# session start; no `{{...}}` substitution, no worktree-relative path — %h
# expands to the user's home directory at read time, same as any other
# environment.d file.
#
# Node (v22.1+; module.enableCompileCache) falls back to a location under
# /tmp when NODE_COMPILE_CACHE is unset, and nothing in this environment set
# it. That default location was measured holding 252,389 inodes — 26% of the
# entire /tmp tmpfs allocation on this box, and the dominant active writer
# during a near-exhaustion incident (~186 inodes/minute). tmpfs enforces a
# per-uid inode cap; a real filesystem path under the user's home does not.
# This drop-in relocates the cache there instead.
#
# Effective for NEW systemd --user sessions only — it is read once at
# session start, so it does not retroactively move an already-running
# process's already-open cache directory. It also does nothing for a process
# that never goes through a systemd --user session in the first place.
#
# Not installed automatically. To apply by hand:
#   mkdir -p ~/.config/environment.d && cp systemd/environment.d-node-compile-cache.conf ~/.config/environment.d/
# then start a new systemd --user session (e.g. log out/in, or
# `systemctl --user daemon-reexec`) for it to take effect.

NODE_COMPILE_CACHE=%h/.cache/node-compile-cache
